name = "morgentidende-media-ingest"
main = "src/ops-entry.ts"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "morgentidende-media"

[images]
binding = "IMAGES"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://media.morgentidende.dk"
MEDIA_MAX_BYTES = "20971520"

# Queue polling is fallback/recovery only. Normal chat publication should use
# the worker's immediate /ingest path; this 1-minute trigger limits worst-case
# delay if the fast path cannot be reached.
[triggers]
crons = ["* * * * *"]

# Secrets required at deploy time (never commit values):
# MEDIA_INGEST_TOKEN
# OPS_MEDIA_TOKEN
# CHAT_MEDIA_TOKEN
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
