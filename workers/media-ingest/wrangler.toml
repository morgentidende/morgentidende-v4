name = "morgentidende-media-ingest"
main = "src/entry.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "morgentidende-media"

[vars]
MEDIA_PUBLIC_BASE_URL = "https://media.morgentidende.dk"
MEDIA_MAX_BYTES = "20971520"

# Secrets required at deploy time (never commit values):
# MEDIA_INGEST_TOKEN
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
