<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Sådan påvirker DSA dit liv på nettet</title><desc id="desc">Mørk Big Brother-inspireret grafik med et stort øje, overvågningskameraer og seks områder: alderstjek, børn, algoritmer, annoncer, moderation og platformansvar.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071925"/><stop offset="0.55" stop-color="#0c2a39"/><stop offset="1" stop-color="#14182f"/></linearGradient><radialGradient id="eye" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#8fd7ff"/><stop offset="0.35" stop-color="#2d789f"/><stop offset="0.72" stop-color="#102b3c"/><stop offset="1" stop-color="#05090d"/></radialGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".18" stroke="#6fb0c8"><path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600M0 720H1600"/><path d="M200 0V900M400 0V900M600 0V900M800 0V900M1000 0V900M1200 0V900M1400 0V900"/></g><text x="800" y="105" text-anchor="middle" fill="#f5f0e7" font-family="Georgia,serif" font-size="64" font-weight="700">Sådan påvirker <tspan fill="#d8a33d">DSA</tspan> dit liv på nettet</text><text x="800" y="150" text-anchor="middle" fill="#d8a33d" font-family="Arial,sans-serif" font-size="20" letter-spacing="7">MERE SIKKERHED — ELLER MINDRE FRIHED?</text><g filter="url(#shadow)"><ellipse cx="800" cy="450" rx="270" ry="125" fill="#dce9ef" opacity=".92"/><ellipse cx="800" cy="450" rx="118" ry="118" fill="url(#eye)"/><circle cx="800" cy="450" r="43" fill="#020507"/><circle cx="765" cy="410" r="18" fill="#fff" opacity=".88"/></g><g fill="#142a38" stroke="#d8a33d" stroke-width="3" filter="url(#shadow)"><rect x="55" y="205" width="400" height="180" rx="18"/><rect x="55" y="515" width="400" height="180" rx="18"/><rect x="1145" y="205" width="400" height="180" rx="18"/><rect x="1145" y="515" width="400" height="180" rx="18"/><rect x="510" y="675" width="580" height="145" rx="18"/></g><g font-family="Georgia,serif" fill="#f5f0e7"><text x="85" y="250" font-size="34" font-weight="700"><tspan fill="#d8a33d">1</tspan> Alderstjek</text><text x="85" y="300" font-family="Arial,sans-serif" font-size="22">• Bevis at du er gammel nok</text><text x="85" y="335" font-family="Arial,sans-serif" font-size="22">• ID, aldersbevis eller estimering</text><text x="85" y="370" font-family="Arial,sans-serif" font-size="22">• Kritik: mindre anonymitet</text><text x="85" y="560" font-size="34" font-weight="700"><tspan fill="#d8a33d">4</tspan> Målrettede annoncer</text><text x="85" y="610" font-family="Arial,sans-serif" font-size="22">• Ingen profilering af børn</text><text x="85" y="645" font-family="Arial,sans-serif" font-size="22">• Følsomme data begrænses</text><text x="85" y="680" font-family="Arial,sans-serif" font-size="22">• Mere kontrol — mindre personalisering</text><text x="1175" y="250" font-size="34" font-weight="700"><tspan fill="#d8a33d">2</tspan> Børn og sociale medier</text><text x="1175" y="300" font-family="Arial,sans-serif" font-size="22">• Private konti som udgangspunkt</text><text x="1175" y="335" font-family="Arial,sans-serif" font-size="22">• Mindre vanedannende design</text><text x="1175" y="370" font-family="Arial,sans-serif" font-size="22">• Mere alderskontrol</text><text x="1175" y="560" font-size="34" font-weight="700"><tspan fill="#d8a33d">5</tspan> Indhold og moderation</text><text x="1175" y="610" font-family="Arial,sans-serif" font-size="22">• Ulovligt indhold skal håndteres</text><text x="1175" y="645" font-family="Arial,sans-serif" font-size="22">• Brugere får klageadgang</text><text x="1175" y="680" font-family="Arial,sans-serif" font-size="22">• Kritik: risiko for overmoderation</text><text x="545" y="720" font-size="34" font-weight="700"><tspan fill="#d8a33d">3</tspan> Algoritmer  ·  <tspan fill="#d8a33d">6</tspan> Platformansvar</text><text x="545" y="765" font-family="Arial,sans-serif" font-size="22">Store platforme skal forklare anbefalinger, vurdere samfundsrisici</text><text x="545" y="798" font-family="Arial,sans-serif" font-size="22">og kan mødes med bøder. Kritikere frygter indirekte pres på lovlig tale.</text></g><g fill="#263746" stroke="#a7c6d5" stroke-width="3"><path d="M610 200l-90 28 28 70 95-25z"/><circle cx="535" cy="245" r="16" fill="#d44"/><path d="M990 200l90 28-28 70-95-25z"/><circle cx="1065" cy="245" r="16" fill="#d44"/></g><path d="M800 565c-125 0-230-47-300-115 70-69 175-115 300-115s230 46 300 115c-70 68-175 115-300 115z" fill="none" stroke="#d8a33d" stroke-width="3" opacity=".65"/><text x="800" y="865" text-anchor="middle" fill="#d9d5cf" font-family="Arial,sans-serif" font-size="20">DSA regulerer især platformenes ansvar. Kritikere advarer om overmoderation, alderskontrol og mindre anonymitet.</text></svg>