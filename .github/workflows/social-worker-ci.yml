name: Social Worker CI

on:
  pull_request:
    paths:
      - 'workers/social-publisher/**'
      - '.github/workflows/social-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/social-publisher/**'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/social-publisher
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Dry-run Worker deploy
        run: npm run check
