name: Passive security test

on:
  push:
    branches:
      - test/security-passive-20260910

permissions:
  contents: read

jobs:
  passive-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Basic external security checks
        shell: bash
        run: |
          set -u
          mkdir -p security-results
          failures=0

          note_fail() {
            echo "FAIL: $1" | tee -a security-results/findings.txt
            failures=$((failures + 1))
          }

          check_status() {
            local expected="$1"; shift
            local url="$1"; shift
            local code
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 "$@" "$url") || code="curl-error"
            echo "$url -> $code" | tee -a security-results/http-status.txt
            if [ "$code" != "$expected" ]; then
              note_fail "Expected HTTP $expected, got $code for $url"
              cat /tmp/body >> security-results/findings.txt 2>/dev/null || true
            fi
          }

          curl -sS -D security-results/home-headers.txt -o security-results/home.html --max-time 20 https://morgentidende.dk/ || note_fail 'Could not fetch homepage'
          cat security-results/home-headers.txt || true
          for header in content-security-policy strict-transport-security x-content-type-options x-frame-options referrer-policy permissions-policy; do
            grep -qi "^${header}:" security-results/home-headers.txt || note_fail "Missing ${header} header on homepage"
          done
          grep -qi '^x-content-type-options:[[:space:]]*nosniff' security-results/home-headers.txt || note_fail 'X-Content-Type-Options is not nosniff'
          grep -qi '^x-frame-options:[[:space:]]*DENY' security-results/home-headers.txt || note_fail 'X-Frame-Options is not DENY'

          check_status 200 https://morgentidende-media-ingest.morgentidende.workers.dev/health
          check_status 401 https://morgentidende-media-ingest.morgentidende.workers.dev/ingest -X POST -H 'content-type: application/json' --data '{}'
          check_status 200 https://morgentidende-cloudflare-admin.morgentidende.workers.dev/health
          check_status 401 https://morgentidende-cloudflare-admin.morgentidende.workers.dev/diagnostics/summary
          check_status 404 https://morgentidende-cloudflare-admin.morgentidende.workers.dev/not-a-real-route

          payload='%3Cscript%3Ealert%281%29%3C%2Fscript%3E'
          curl -sS --max-time 20 "https://morgentidende.dk/soeg?q=${payload}" -o security-results/xss-search.html || note_fail 'Could not fetch XSS search probe'
          if grep -Fq '<script>alert(1)</script>' security-results/xss-search.html; then
            note_fail 'Potential reflected XSS: raw script payload found in response'
          fi

          curl -sS -D security-results/login-headers.txt -o /dev/null --max-time 20 https://morgentidende.dk/login || note_fail 'Could not fetch login page'
          grep -qi '^cache-control:.*no-store' security-results/login-headers.txt || note_fail 'Login page is missing no-store cache policy'

          echo "basic_failures=$failures" | tee security-results/basic-summary.txt
          exit 0

      - name: OWASP ZAP baseline passive scan
        shell: bash
        run: |
          set -u
          docker run --rm -v "$PWD/security-results:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://morgentidende.dk -m 2 -I -r zap-report.html -w zap-report.md || true

      - name: Summarize findings
        shell: bash
        run: |
          echo '=== Basic findings ==='
          cat security-results/findings.txt 2>/dev/null || echo 'No basic failures recorded.'
          echo '=== ZAP report ==='
          sed -n '1,260p' security-results/zap-report.md 2>/dev/null || echo 'No ZAP markdown report produced.'

      - name: Upload security results
        uses: actions/upload-artifact@v4
        with:
          name: passive-security-results
          path: security-results/
          retention-days: 3
