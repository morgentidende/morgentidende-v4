name: Cloudflare Ops Bridge

on:
  push:
    branches:
      - ops/cloudflare
    paths:
      - cloudflare-ops/request.json
      - .github/scripts/cloudflare-ops.mjs
      - .github/workflows/cloudflare-ops.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Execute allowlisted Cloudflare operation
        env:
          ADMIN_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_TOKEN }}
          ADMIN_BASE_URL: https://morgentidende-cloudflare-admin.morgentidende.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_NAME: morgentidende.dk
        run: |
          ACTION=$(node -e "const r=require('./cloudflare-ops/request.json'); process.stdout.write(String(r.action||''))")
          if [ "$ACTION" != "media_ingest_url" ]; then
            node .github/scripts/cloudflare-ops.mjs
            exit 0
          fi

          node - <<'NODE' > /tmp/media-payload.json
          const r = require('./cloudflare-ops/request.json');
          const p = r.payload;
          if (!p || typeof p !== 'object') throw new Error('payload_required');
          if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(p.article_id || ''))) throw new Error('valid_article_id_required');
          const u = new URL(String(p.source_url || ''));
          if (u.protocol !== 'https:') throw new Error('https_source_required');
          if (p.commercial_use_allowed !== true || p.local_storage_allowed !== true) throw new Error('archive_rights_required');
          process.stdout.write(JSON.stringify(p));
          NODE

          OPS_TOKEN=$(node -e "const c=require('node:crypto'); process.stdout.write(c.createHash('sha256').update('morgentidende-media-ops:'+process.env.ADMIN_TOKEN).digest('hex'))")

          ingest() {
            curl --silent --show-error \
              -o /tmp/media-response.json \
              -w '%{http_code}' \
              -X POST 'https://morgentidende-media-ingest.morgentidende.workers.dev/ingest' \
              -H "Authorization: Bearer $OPS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/media-payload.json
          }

          STATUS=$(ingest)

          # Normal path does not touch Cloudflare administration at all. If the
          # ops token is ever rotated or lost, repair it once and retry.
          if [ "$STATUS" = "401" ]; then
            ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/zones?name=morgentidende.dk&status=active&per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(async r=>{const j=await r.json();const id=j.result?.[0]?.account?.id;if(!r.ok||j.success===false||!id){console.error(JSON.stringify(j));process.exit(1)}process.stdout.write(id)})")
            export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"
            printf '%s' "$OPS_TOKEN" | npx --yes wrangler@4.37.1 secret put OPS_MEDIA_TOKEN --name morgentidende-media-ingest >/dev/null
            STATUS=$(ingest)
          fi

          cat /tmp/media-response.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "media_ingest_http_status=$STATUS" >&2
            exit 1
          fi
