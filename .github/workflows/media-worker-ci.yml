name: Media Worker CI

on:
  pull_request:
    paths:
      - 'workers/media-ingest/**'
      - '.github/workflows/media-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'workers/media-ingest/**'
      - '.github/workflows/media-worker-ci.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/media-ingest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Dry-run Worker deploy
        run: npx wrangler deploy --dry-run --outdir /tmp/media-worker-build

      - name: Resolve Cloudflare account
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/zones?name=morgentidende.dk&status=active&per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(async r=>{const j=await r.json();const id=j.result?.[0]?.account?.id;if(!r.ok||j.success===false||!id){console.error(JSON.stringify(j));process.exit(1)}console.log(id)})")
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy media worker
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy

      - name: Warn when deploy permission is missing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.deploy.outcome == 'failure'
        run: echo '::warning::Media Worker was built successfully but not deployed. CLOUDFLARE_API_TOKEN needs Workers Scripts Edit permission.'
