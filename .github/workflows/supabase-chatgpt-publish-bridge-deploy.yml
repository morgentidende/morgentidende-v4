name: Deploy Supabase ChatGPT publish bridge

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/chatgpt-publish-bridge/**'
      - '.github/workflows/supabase-chatgpt-publish-bridge-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-chatgpt-publish-bridge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy chatgpt-publish-bridge
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy chatgpt-publish-bridge --project-ref lfttxjxfggjcxmdfjndk --no-verify-jwt
