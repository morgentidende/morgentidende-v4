name: Deploy social queue producer
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/social-dispatcher/**'
      - '.github/workflows/social-distribution-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: social-distribution-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy queue producer (never publishes)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy social-dispatcher --project-ref lfttxjxfggjcxmdfjndk

