name: Deploy social distribution

on:
  push:
    branches: [main]
    paths:
      - 'workers/social-publisher/**'
      - 'supabase/functions/social-dispatcher/**'
      - '.github/workflows/social-distribution-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: social-distribution-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install social publisher dependencies
        working-directory: workers/social-publisher
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve Cloudflare account
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          zone_json=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            'https://api.cloudflare.com/client/v4/zones?name=morgentidende.dk&status=active&per_page=5')
          account_id=$(jq -r '.result[0].account.id // empty' <<<"$zone_json")
          test -n "$account_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Metricool adapter
        working-directory: workers/social-publisher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$METRICOOL_TOKEN"
          printf '%s' "$METRICOOL_TOKEN" | npx wrangler secret put METRICOOL_TOKEN
          npx wrangler deploy

      - name: Deploy Supabase dispatcher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy social-dispatcher --project-ref lfttxjxfggjcxmdfjndk

      - name: Verify social publisher health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://morgentidende-social-publisher.morgentidende.workers.dev/health' \
            | jq -e '.ok == true and .provider == "metricool" and .configured == true' >/dev/null
