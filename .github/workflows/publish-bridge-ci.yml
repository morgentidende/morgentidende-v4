name: Publish bridge CI

on:
  pull_request:
    paths:
      - '.github/scripts/process-chatgpt-publish-queue.mjs'
      - '.github/scripts/publish-kind.mjs'
      - '.github/scripts/publish-kind.test.mjs'
      - '.github/scripts/publish-payload-fields.mjs'
      - '.github/scripts/publish-payload-fields.test.mjs'
      - '.github/workflows/publish-bridge-ci.yml'

permissions:
  contents: read

jobs:
  kind-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test publish kind and payload-field contracts
        run: node --test .github/scripts/publish-kind.test.mjs .github/scripts/publish-payload-fields.test.mjs
