name: Livecenter Metrics Worker CI

on:
  pull_request:
    paths:
      - 'workers/livecenter-metrics/**'
      - '.github/workflows/livecenter-metrics-worker-ci.yml'
      - 'supabase/migrations/*livecenter_metric*'
      - 'v4-frontend/src/components/GenericLiveCenter.astro'
  push:
    branches: [main]
    paths:
      - 'workers/livecenter-metrics/**'
      - '.github/workflows/livecenter-metrics-worker-ci.yml'
      - 'supabase/migrations/*livecenter_metric*'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: workers/livecenter-metrics
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate worker build
        working-directory: workers/livecenter-metrics
        run: npx wrangler deploy --dry-run --outdir /tmp/livecenter-metrics-build

      - name: Resolve Cloudflare account
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ACCOUNT_ID=$(node -e "fetch('https://api.cloudflare.com/client/v4/zones?name=morgentidende.dk&status=active&per_page=1',{headers:{authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}}).then(async r=>{const j=await r.json();const id=j.result?.[0]?.account?.id;if(!r.ok||j.success===false||!id){console.error(JSON.stringify(j));process.exit(1)}console.log(id)})")
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Deploy livecenter metrics worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node workers/livecenter-metrics/deploy.mjs
