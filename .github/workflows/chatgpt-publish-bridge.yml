name: ChatGPT publish bridge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'publish-queue/*.json'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: chatgpt-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'publish/chatgpt-') &&
      startsWith(github.event.pull_request.title, '[PUBLISH] ') &&
      contains(github.event.pull_request.body || '', '<!-- morgentidende-chatgpt-publish -->')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_PROJECT_REF: lfttxjxfggjcxmdfjndk
      PR_NUMBER: ${{ github.event.pull_request.number }}
      GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted bridge code from main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch proposed queue commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch origin "$HEAD_SHA"

      - name: Enforce transport boundary and materialize payload
        id: scope
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          merge_base=$(git merge-base origin/main "$HEAD_SHA")
          mapfile -t changed < <(git diff --name-only "$merge_base" "$HEAD_SHA")
          printf 'Changed files:\n%s\n' "${changed[*]}"
          if [ "${#changed[@]}" -ne 1 ]; then
            echo "Publish PR must change exactly one file" >&2
            exit 1
          fi
          queue_file="${changed[0]}"
          if [[ ! "$queue_file" =~ ^publish-queue/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "Only publish-queue/*.json is allowed" >&2
            exit 1
          fi
          mkdir -p "$(dirname "$queue_file")"
          git show "$HEAD_SHA:$queue_file" > "$queue_file"
          echo "queue_file=$queue_file" >> "$GITHUB_OUTPUT"

      - name: Validate queue payload
        env:
          QUEUE_FILE: ${{ steps.scope.outputs.queue_file }}
          VALIDATE_ONLY: '1'
        run: node .github/scripts/process-chatgpt-publish-queue.mjs

      - name: Publish through OIDC-authenticated Supabase Edge Function
        env:
          QUEUE_FILE: ${{ steps.scope.outputs.queue_file }}
        run: node .github/scripts/process-chatgpt-publish-queue.mjs

      - name: Close successful transport PR
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr close "$PR_NUMBER" --delete-branch --comment "Published through the Morgentidende GitHub bridge."
